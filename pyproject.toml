[project]
name = "hunter-job-search-agent"
version = "0.1.0"
description = "Quality-first autonomous job-search system with evidence-linked documents and verified browser workflows."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
authors = [
    { name = "Lorenzo De Luca" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "boto3>=1.42.84",
    "browser-use[video]>=0.13.7",
    "fastapi>=0.135.3",
    "filelock>=3.25.2",
    "google-api-python-client>=2.170.0",
    "google-auth-oauthlib>=1.2.2",
    "langchain-aws>=1.4.3",
    "langchain-core>=1.2.28",
    "langchain-google-genai>=4.2.5",
    "openai>=2.16.0",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.3",
    "psutil>=6.1.0",
    "pymupdf>=1.27.2.2",
    "python-jobspy>=1.1.82",
    "pyyaml>=6.0.1",
    "rendercv[full]>=2.8,<2.9",
    "uvicorn>=0.44.0",
]

[project.urls]
Repository = "https://github.com/lodelux/hunter-public"

[tool.uv]
# JobSpy and Browser Use carry stale strict pins that conflict with the shared
# runtime or retain versions with published security fixes.
override-dependencies = [
    "click>=8.3.3,<9",
    "markdownify==1.2.2",
    "mcp>=1.28.1,<2",
    "numpy==2.5.1",
    "pypdf>=6.15.0,<7",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.coverage.run]
branch = true
source = ["backend"]
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
